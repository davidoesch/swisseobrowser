# Publishes the single-file swissEO Browser to GitHub Pages:
#   https://davidoesch.github.io/swisseobrowser/
# Only swisseo-browser.html is deployed (as index.html); the upstream
# Copernicus Browser sources in this repository are not built or published.
name: Deploy swissEO Browser to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - swisseo-browser.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp swisseo-browser.html _site/index.html
          cp swisseo-browser.html _site/swisseo-browser.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
